name: my first pipeline
on:
    push: 
          branches: [main]
jobs: 
    build:
        runs-on: ubuntu-latest  # macos-latest, windows-latest
        steps:
            - name: Clone the code
              uses: actions/checkout@v4
            - name: Build image
              run:
                docker build -t djahacharles/cicd-portfolio . 
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: djahacharles   
                password: ${{ secrets.DOCKER_PW }}
            - name: Push image
              run:
                docker push djahacharles/cicd-portfolio