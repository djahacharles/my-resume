name: Build and push to ECR
on:
    push:
       # pull_requests:
        #    branches: {['mai', 'dev']
        branches: ['main']

jobs:
    build_scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v7
              #with:
                #repository:
            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                severity: HIGH,CRITICAL
                exit-code: 1

            - name: Build Docker image
              run: docker build -t 007091974983.dkr.ecr.us-east-1.amazonaws.com/my-dj-repo:latest .

            - name: Scan Docker Image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 007091974983.dkr.ecr.us-east-1.amazonaws.com/my-dj-repo:latest
                format: table
                exit-code: 1
                ignore-unfixed: true
                severity: CRITICAL,HIGH
                                   
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
              with:
                role-to-assume: arn:aws:iam::007091974983:role/github-actions-role
                aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              